name: Nightly Release

on:
  push:
    branches:
      - publish

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            platform: windows
            arch: x64
          - name: macos-arm64
            os: macos-15
            platform: macos
            arch: arm64

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7.0.1

      - name: Enable Git long paths on Windows
        if: matrix.platform == 'windows'
        shell: bash
        run: git config --global core.longpaths true

      - name: Setup pnpm + Node + dependencies
        uses: ./.github/actions/setup
        with:
          node-version: '22.21.1'

      # Cache Electron binary; key on package.json so it busts when Electron version changes.
      - name: Cache Electron binary
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ matrix.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            electron-${{ matrix.os }}-

      - name: build-windows
        if: matrix.platform == 'windows'
        run: pnpm run build:win:${{ matrix.arch }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: build-mac
        if: matrix.platform == 'macos'
        run: pnpm run build:mac:${{ matrix.arch }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: mps-${{ matrix.name }}
          retention-days: 30
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.zip
            release/*.dmg
            release/*.blockmap
            release/*.yml
            release/*.yaml

  release:
    name: Publish nightly release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7.0.1

      - name: Download all platform artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: release
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        working-directory: release
        run: |
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -printf '%f\n' \
            | LC_ALL=C sort \
            | xargs -r -I{} sha256sum "{}" > SHA256SUMS.txt

      - name: Move nightly tag to the published commit
        run: |
          git tag -f nightly "$GITHUB_SHA"
          git push --force origin refs/tags/nightly

      - name: Create or update nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release_body.md <<EOF
          Automated nightly build from the publish branch at ${GITHUB_SHA}.

          macOS builds are unsigned. After moving the application to Applications, clear the quarantine flag once:

          \`\`\`
          xattr -cr "/Applications/Markdown Publication Studio.app"
          \`\`\`

          Verify downloaded files with SHA256SUMS.txt:

          \`\`\`
          sha256sum -c SHA256SUMS.txt --ignore-missing
          \`\`\`
          EOF

          if gh release view nightly --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit nightly \
              --repo "$GITHUB_REPOSITORY" \
              --title "Nightly" \
              --notes-file release_body.md \
              --prerelease \
              --verify-tag

            gh release view nightly \
              --repo "$GITHUB_REPOSITORY" \
              --json assets \
              --jq '.assets[].name' |
              while IFS= read -r asset; do
                if [ -n "$asset" ]; then
                  gh release delete-asset nightly "$asset" --yes --repo "$GITHUB_REPOSITORY"
                fi
              done

            gh release upload nightly release/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create nightly release/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Nightly" \
              --notes-file release_body.md \
              --prerelease \
              --latest=false \
              --verify-tag
          fi
